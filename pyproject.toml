[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycchess-sf"
version = "0.1.0"
description = "象棋小巫师 XQWL06：C++ 规则+搜索 .so、网页人机对弈"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sanic>=23.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mycchess-play-web = "mycchess_sf.play_web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycchess_sf*"]
