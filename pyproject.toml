[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycchess-sf"
version = "0.2.0"
description = "象眸 SF (Iris SF): XQWL-rooted xiangqi engine with NNUE and web play"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sanic>=23.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mycchess-play-web = "mycchess_sf.play_web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycchess_sf*"]

[tool.setuptools.package-data]
mycchess_sf = ["static/xqwl/*"]
