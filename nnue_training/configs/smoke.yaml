data:
  source: ../nnue_data
  pattern: "worker_*/chunk_*.txt"
  val_workers: [30, 31]
  dedupe_fen: true
  quiet_only: false
  quiet_pst_margin: 70
  mate_threshold: 9800
  mate_remap: false
  mate_exclude_from_zscore: true

model:
  n_features: 1260
  l1: 512
  l2: 32
  l3: 32

train:
  batch_size: 2048
  max_epochs: 384
  early_stopping_patience: 32
  lr: 0.001
  weight_decay: 0.0
  mse_loss_weight: 0.5
  ranking_loss_weight: 0.5
  ranking_max_pairs: 4096
  num_workers: 4
  prefetch_factor: 2
  device: cpu
  checkpoint_dir: checkpoints
  log_every: 50
