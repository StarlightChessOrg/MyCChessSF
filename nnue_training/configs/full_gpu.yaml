# 正式 GPU 训练：约 1090 万行 merged.txt（workspace 根目录 nnue_data/）
data:
  source: ../../nnue_data
  pattern: "merged.txt"
  val_ratio: 0.01
  val_seed: 42
  load_workers: auto
  feature_kind: half_ka_v2_hm

model:
  n_features: 16536
  l1: 512
  l2: 32
  l3: 32
  feature_kind: half_ka_v2_hm

train:
  batch_size: 16384
  max_epochs: 384
  early_stopping_patience: 32
  lr: 0.001
  weight_decay: 0.0
  num_workers: auto
  prefetch_factor: 4
  precompute_features: true
  feature_workers: auto
  tqdm: true
  device: cuda
  checkpoint_dir: checkpoints/full_gpu
